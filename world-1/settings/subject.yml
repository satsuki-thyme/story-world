# 個別の物事

- item group: 鉱物
  contents:

    - item: 照花石鉱（しょうかせっこう）
      contents:
        弱い魔物が忌避するため青燐草とともに魔物除けの材料として使われている

    - item: 遍整白魔岩（へんせいはくまがん）
      contents:
        ミラゼクトと鉄の酸化物
        白灰色
        真像が「概旨を伝える」という意味を含んでいる
        魔力を貯める、流すという魔法特性に優れている

- item group: 金属（合金）
  contents:

    - item: 白靱鋼（はくじんこう）
      contents:
        鉄より軽く、錆びず、鋼より硬く強靱で、魔法現象の伝導性がミラゼクトより高い
        軽快な銀色
        鉄、ミラゼクト、炭素をそれぞれ重量比で67%、32%、1%程度で混合したもの
        生成はエクアレクトの精製加工技術と同じくドワーフの秘宝

- item group: 邪霊
  contents:

    - item: ウィスプ
      contents:
        物体による攻撃が当たらない
        魔法による攻撃が有効
        種族固有の魔法による攻撃をしてくる

- item group: 植物
  contents:

    - item group: その他の植物
      contents:

        - item: 風の宿り木
          contents:
            森の、風の魔力が湧き出しているところに生える
            秋に実をつける
            実を翼妖精が好む

    - item group: 薬草
      contents:

        - item: 偲月草（しげつそう）
          contents:
            新月の夜、月を偲ぶように白い燐光を放つ花を咲かせる
            深い森の奥、森林魔力の多いところに自生する
            妖精の治療に花が使われる
              生花でも乾燥させたものでもいい
              新月の夜に開花しているものを、偲月草の精霊と契約して行使できる精霊魔法〈思いは共に〉を使って採取したものに限る

        - item: 青燐草
          contents:
            弱い魔物が忌避するため照花石鉱とともに魔物除けの材料として使われている

    - item group: 野菜
      contents:

        - item: 大薊（おおあざみ）
          contents:
            正しくは朝鮮薊
            アーティチョーク
            本格的に栽培され始めたのは15世紀イタリアのナポリ近辺で、16世紀からフランス・ドイツ・イギリスへと徐々にヨーロッパ全域に広がった

- item group: 魔導具
  contents:

    - item: 収納石
      hints: 収納結晶, 吸石, 吸収石
      contents:
        精神を持たない物体を情報として収納・取り出しすることができる
        拳大の収納石に100kg程度が限界（魔法石は拳大の大きさを生成するのが限界 ref = things.yml/魔法石）
        情報の複製はできない
        通常の状態と同じように時間が経過するものや、経過が遅いもの、経過しないものがある
        収納・取り出しは魔力の簡単な操作で行える
        収納・取り出しの魔力操作は作者によって多少の違いがあるがおよそ似たり寄ったりになっている
        中には収納・取り出しに特別な操作を必要とするものもあり商人が高額な商品などを納める際に使われている。ただし他人が破れないわけではない
        割れたり欠けたりすると致命的な問題になることがあるので球形にしたり、扱いやすさから角の丸まった円筒形することが多い

    - item: レプリノ
      contents:
        魔力と反発する布
        作り方
          用意するもの
            ｜翼手魔狼《プテラグルヴ》の飛膜
            アルテエーテル（魔法力回復薬）
            魔法石（魔力を内包できる石）の粉末
            ミスリルの板
          手順
            1. 月光の下で｜翼手魔狼《プテラグルヴ》の飛膜をアルテエーテルに一晩浸ける
            2. 1. に魔法石の粉末をまぶす
            3. 2. をミスリルの板ではさむ
            4. 3. に高圧で魔力をかける

- item group: 魔導装置
  contents:

    - item: 幻影闘技場（げんえいとうぎじょう）
      contents:
        遍整白魔岩を使った拳大の立方体を敷き詰めて舞台とする
        起動時には甲高い音がして舞台に対象者が映像として出現する

- item group: 妖精
  contents:

    - item: 翼妖精
      contents:
        妖精の森に暮らしている
        妖精の森の、風の魔力に惹かれている
        森の魔力を森の外に持ち出す役割をしている（当人に自覚はない）

    - item: 蜜妖精
      contents:
        花の蜜から精蜜を作る妖精（この世界に虫は存在しない）
